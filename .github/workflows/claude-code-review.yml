# Generated by ~/.claude/scripts/claude_review_router.py — do not edit by hand.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    env:
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pick account with most weekly limit left
        id: pick
        env:
          T_CONTA1: ${{ secrets.CLAUDE_OAUTH_CONTA1 }}
          T_CONTA2: ${{ secrets.CLAUDE_OAUTH_CONTA2 }}
          T_CONTA3: ${{ secrets.CLAUDE_OAUTH_CONTA3 }}
          T_LEGACY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code@latest > /tmp/npm.log 2>&1 || tail -5 /tmp/npm.log
          command -v claude || echo "claude CLI not on PATH"
          python3 - <<'PY'
          import json, os, subprocess, tempfile

          def probe(token):
              """Return (seven_day, five_hour) utilization 0-1, or None if the token failed."""
              env = {k: v for k, v in os.environ.items() if not k.startswith(("ANTHROPIC_", "T_"))}
              env["CLAUDE_CODE_OAUTH_TOKEN"] = token
              try:
                  proc = subprocess.run(
                      ["claude", "-p", "ok", "--model", "haiku", "--output-format", "json", "--verbose"],
                      env=env, cwd=tempfile.mkdtemp(), capture_output=True, text=True, timeout=120,
                  )
                  events = json.loads(proc.stdout)
              except (subprocess.SubprocessError, OSError, ValueError) as exc:
                  detail = locals().get("proc")
                  tail = (detail.stderr or detail.stdout)[-300:] if detail else ""
                  print(f"  probe error: {type(exc).__name__}: {str(exc)[:200]} {tail}")
                  return None
              if isinstance(events, dict):
                  events = [events]
              for event in events:
                  info = event.get("rate_limit_info") if isinstance(event, dict) else None
                  if info:
                      if info.get("status") == "rejected":
                          return (1.0, 1.0)
                      win = info.get("unifiedWindows") or {}
                      return (win.get("seven_day", {}).get("utilization", 0.5),
                              win.get("five_hour", {}).get("utilization", 0.0))
              ok = any(isinstance(e, dict) and e.get("type") == "result" and not e.get("is_error") for e in events)
              return (0.5, 0.0) if ok else None

          seen, ranked, broken = set(), [], []
          for name in ("CONTA1", "CONTA2", "CONTA3", "LEGACY"):
              token = os.environ.get(f"T_{name}", "")
              if not token or token in seen:
                  continue
              seen.add(token)
              usage = probe(token)
              if usage is None:
                  broken.append(name)
                  print(f"{name}: probe failed (token invalid or API down)")
                  continue
              seven, five = usage
              # An account near its 5-hour cap goes behind the others even with weekly room.
              ranked.append((five >= 0.9, seven, name))
              print(f"{name}: seven_day={seven:.0%} five_hour={five:.0%}")
          order = [n for _, _, n in sorted(ranked)] + broken
          order += ["NONE"] * (3 - len(order))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for i, name in enumerate(order[:3], 1):
                  fh.write(f"a{i}={name}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("### Conta do Claude escolhida\n\nOrdem de tentativa: " + " → ".join(order[:3]) + "\n")
          PY

      - name: Claude (attempt 1)
        id: try1
        if: steps.pick.outputs.a1 != 'NONE'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.pick.outputs.a1 == 'CONTA1' && secrets.CLAUDE_OAUTH_CONTA1 || steps.pick.outputs.a1 == 'CONTA2' && secrets.CLAUDE_OAUTH_CONTA2 || steps.pick.outputs.a1 == 'CONTA3' && secrets.CLAUDE_OAUTH_CONTA3 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: '{"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'
          plugin_marketplaces: ${{ 'review' == 'review' && 'https://github.com/anthropics/claude-code.git' || '' }}
          plugins: ${{ 'review' == 'review' && 'code-review@claude-code-plugins' || '' }}
          prompt: ${{ 'review' == 'review' && format('/code-review:code-review --comment {0}/pull/{1}', github.repository, github.event.pull_request.number) || '' }}
          claude_args: ${{ format('{0} {1}', 'review' == 'review' && '--allowedTools "mcp__github_inline_comment__create_inline_comment"' || '', 'review'l != '' && format('--model {0}', 'review'l) || '') }}
          additional_permissions: |
            actions: read

      - name: Claude (attempt 2)
        id: try2
        if: steps.try1.outcome == 'failure' && steps.pick.outputs.a2 != 'NONE'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.pick.outputs.a2 == 'CONTA1' && secrets.CLAUDE_OAUTH_CONTA1 || steps.pick.outputs.a2 == 'CONTA2' && secrets.CLAUDE_OAUTH_CONTA2 || steps.pick.outputs.a2 == 'CONTA3' && secrets.CLAUDE_OAUTH_CONTA3 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: '{"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'
          plugin_marketplaces: ${{ 'review' == 'review' && 'https://github.com/anthropics/claude-code.git' || '' }}
          plugins: ${{ 'review' == 'review' && 'code-review@claude-code-plugins' || '' }}
          prompt: ${{ 'review' == 'review' && format('/code-review:code-review --comment {0}/pull/{1}', github.repository, github.event.pull_request.number) || '' }}
          claude_args: ${{ format('{0} {1}', 'review' == 'review' && '--allowedTools "mcp__github_inline_comment__create_inline_comment"' || '', 'review'l != '' && format('--model {0}', 'review'l) || '') }}
          additional_permissions: |
            actions: read

      - name: Claude (attempt 3)
        id: try3
        if: steps.try2.outcome == 'failure' && steps.pick.outputs.a3 != 'NONE'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.pick.outputs.a3 == 'CONTA1' && secrets.CLAUDE_OAUTH_CONTA1 || steps.pick.outputs.a3 == 'CONTA2' && secrets.CLAUDE_OAUTH_CONTA2 || steps.pick.outputs.a3 == 'CONTA3' && secrets.CLAUDE_OAUTH_CONTA3 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: '{"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'
          plugin_marketplaces: ${{ 'review' == 'review' && 'https://github.com/anthropics/claude-code.git' || '' }}
          plugins: ${{ 'review' == 'review' && 'code-review@claude-code-plugins' || '' }}
          prompt: ${{ 'review' == 'review' && format('/code-review:code-review --comment {0}/pull/{1}', github.repository, github.event.pull_request.number) || '' }}
          claude_args: ${{ format('{0} {1}', 'review' == 'review' && '--allowedTools "mcp__github_inline_comment__create_inline_comment"' || '', 'review'l != '' && format('--model {0}', 'review'l) || '') }}
          additional_permissions: |
            actions: read

      - name: Fail when every account failed
        if: steps.try1.outcome != 'success' && steps.try2.outcome != 'success' && steps.try3.outcome != 'success'
        run: |
          echo "::error::Nenhuma conta do Claude conseguiu rodar (ordem: ${{ steps.pick.outputs.a1 }}, ${{ steps.pick.outputs.a2 }}, ${{ steps.pick.outputs.a3 }})."
          exit 1
